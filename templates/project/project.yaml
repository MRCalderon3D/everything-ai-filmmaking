# production/project.yaml — workspace configuration
# Schema: schemas/project.schema.json
# Every command inherits these defaults; override per run with flags.

title: "The Red Suitcase"          # working title of the production
format: short                      # short | feature | series — drives pacing and coverage defaults
logline: "A woman fleeing her past finds a stranger's red suitcase on a rain-soaked platform — and inside it, proof that her past is fleeing her."
genre: noir                        # primary genre label

aspect_ratio: "16:9"               # width:height — quote it so YAML keeps it a string
fps: 24                            # target frames per second
resolution: "1920x1080"            # delivery resolution, WIDTHxHEIGHT

style:                             # global visual anchors; detail lives in the style bible
  look_refs:                       # approved LOOK_* style reference assets
    - LOOK_NOIR_NIGHT_V01
  influences:                      # films / photographers / movements that anchor the look
    - "The Third Man (1949) — wet cobblestone night exteriors"
    - "Saul Leiter — color reflections through glass"
  notes: "Sodium-vapor warmth against blue-hour shadow; rain on every exterior."

default_providers:                 # default generation backend per kind
  image: fal                       # fal | replicate | comfyui | harness-native
  video: veo                       # veo | kling | runway | seedance | fal
  audio: elevenlabs                # elevenlabs | fal | local

created_at: "2026-07-13T00:00:00Z" # set by create-project.js
version: "0.1.0"                   # workspace metadata version
